<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單字卡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>單字卡</h1>

    <!-- 新增單字 -->
    <div class="add-card-form">
      <h3>新增單字卡</h3>
      <input type="text" id="wordInput" placeholder="請輸入單字 (例如: Apple、林檎)">
      <input type="text" id="translationInput" placeholder="請輸入中文翻譯 (例如: 蘋果)">
      <button id="addBtn">新增單字</button>
    </div>

    <!-- 單字卡 -->
    <div class="card-area" id="cardArea">
    </div>

    <!-- 按鈕-->
    <div class="controls">
      <button id="prevBtn">⬅️ 上一張</button>
      <button id="randomBtn">隨機</button>
      <button id="nextBtn">下一張 ➡️</button>
    </div>

    <div class="action-bar">
      <button id="markBtn" class="btn-success">✅ 標記為已熟記 / 隱藏</button>
      <button id="deleteBtn" class="btn-danger">🗑️ 刪除此單字</button>
    </div>

    <!-- 重製按鈕 -->
    <div style="margin-top: 10px;">
      <button id="resetBtn" onclick="resetCards()" style="width: 100%; background-color: #607d8b; color: white; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
        🔄 重製所有單字卡（重新複習）
      </button>
    </div>

    
  </div>

  <script src="app.js"></script>
</body>
</html>
